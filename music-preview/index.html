<script>
(() => {
  const frame = document.getElementById('blog');
  const requested = new URLSearchParams(location.search).get('page') || '/';
  const first = new URL(requested, location.origin);
  const start = first.origin === location.origin && !first.pathname.startsWith('/music-preview/')
    ? first.href : location.origin + '/';
  const titles = new Map([["/2026/03/02/Senren%20Banka/","《千恋*万花》：Galgame界的原神？我的入坑作杂谈 · Sana's Blog"],["/2026/02/01/First-Introduction/","算是自我介绍？ · Sana's Blog"],["/2026/07/01/Standard/","关于本站的评分细则与交流指南 · Sana's Blog"],["/2026/06/14/Atri/","《Atri-My Dear Moments》：标准的新人入坑作 · Sana's Blog"]]);
  const siteTitle = document.title;
  function showTitle(pathname) {
    const path = pathname.replace(/index[.]html$/, '');
    document.title = titles.get(path) || titles.get(path.replace(/[/]?$/, '/')) || siteTitle;
  }
  history.replaceState(null, '', start);
  showTitle(location.pathname);

  // Give each article one browser history entry. Frame loads replace their own entry.
  function navigate(url) {
    history.pushState(null, '', url);
    showTitle(location.pathname);
    frame.contentWindow.location.replace(url);
  }
  window.addEventListener('popstate', () => {
    showTitle(location.pathname);
    if (frame.contentWindow.location.href !== location.href) {
      frame.contentWindow.location.replace(location.href);
    }
  });
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.URL === 'about:blank') return;
    const view = doc.defaultView;
    const sync = () => {
      if (view.location.href !== location.href) history.replaceState(null, '', view.location.href);
      document.title = doc.title;
    };
    sync();
    view.addEventListener('hashchange', sync);
    doc.addEventListener('click', event => {
      const link = event.target.closest?.('a[href]');
      if (!link || event.defaultPrevented || event.button !== 0 ||
          event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
          link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
      const url = new URL(link.href, doc.baseURI);
      if (url.origin !== location.origin || url.pathname.startsWith('/music-preview/')) return;
      if (url.pathname !== '/' && !url.pathname.endsWith('/') && !url.pathname.endsWith('.html')) return;
      event.preventDefault();
      if (url.href !== location.href) navigate(url.href);
      else if (url.hash) view.location.replace(url.href);
    });
  });
  frame.src = start;
})();

<script>
  function stylePlaylistNames(player) {
    const albums = player.querySelector('.album-list');
    const header = player.querySelector('.song-list .musicheader');
    if (!albums || !header || albums.dataset.namesReady) return;
    const shortName = name => name.replace(/^纯音乐[（(]不是很纯[）)]/, '纯音乐');
    const updateAlbums = () => {
      const heading = albums.querySelector('.musicheader');
      if (heading && heading.textContent.trim() === "Sana's Blog - 音乐播放器") {
        heading.textContent = 'Sana 的随身听';
      }
      for (const row of albums.querySelectorAll('.myhklist li')) {
        const title = row.lastChild;
        if (title?.nodeType !== Node.TEXT_NODE) continue;
        const match = title.data.trim().match(/^《?(.+?)》? - wgwhnokoa$/);
        if (match) title.data = shortName(match[1]);
      }
    };
    const updateHeader = () => {
      const title = header.querySelector('span');
      if (title && shortName(title.textContent) !== title.textContent) {
        title.textContent = shortName(title.textContent);
      }
    };
    const changes = { childList: true, subtree: true, characterData: true };
    new MutationObserver(updateAlbums).observe(albums, changes);
    new MutationObserver(updateHeader).observe(header, changes);
    albums.dataset.namesReady = 'true';
    updateAlbums();
    updateHeader();
  }
  function enableOrderMenu() {
    const player = document.getElementById('myhkplayer');
    const label = player.querySelector('.myhkmoshi');
    const cycle = player.querySelector('.qhms');
    if (!label || !cycle || player.querySelector('.music-order')) return;

    const modes = new Map([
      ['随机播放', '随机播放'],
      ['单曲循环', '单曲循环'],
      ['专辑循环', '列表循环']
    ]);
    const menu = document.createElement('select');
    menu.className = 'music-order';
    menu.setAttribute('aria-label', '播放顺序');
    for (const [nativeName, name] of modes) menu.add(new Option(name, nativeName));
    const currentMode = () => label.textContent.trim();
    const sync = () => { menu.value = currentMode(); };
    label.before(menu);
    sync();
    new MutationObserver(sync).observe(label, { childList: true, subtree: true, characterData: true });
    menu.addEventListener('change', () => {
      const selected = menu.value;
      for (let step = 1; step < modes.size && currentMode() !== selected; step++) {
        cycle.click();
      }
      sync();
    });
  }
  const musicToggle = document.getElementById('music-toggle');
  musicToggle.addEventListener('click', () => {
    const opening = musicToggle.getAttribute('aria-expanded') === 'false';
    if (opening) {
      stylePlaylistNames(document.getElementById('myhkplayer'));
      enableOrderMenu();
    }
    musicToggle.setAttribute('aria-expanded', String(opening));
    musicToggle.setAttribute('aria-label', opening ? '收起音乐播放器' : '展开音乐播放器');
  });
</script>
